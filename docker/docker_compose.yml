services:
  mongodb:
    
    image: mongo:7-jammy
    
    container_name : mongodb
   
    ports:
      - "27007:27017"
   
    volumes:
      - mongodb:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend

    restart : always 

  pgvector:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name : pgvector
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data_v18:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend
    restart : always


networks:
  backend:

volumes:
  mongodb : 
  pgvector_data:
  pgvector_data_v18:
